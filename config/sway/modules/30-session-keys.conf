# App launch, closing windows, configuration and logout.
bindsym --to-code $mod+Return exec $term
bindsym --to-code $mod+w kill
bindsym --to-code $mod+Space exec $menu
bindsym --to-code $mod+Shift+c reload
bindsym --to-code $mod+Shift+e exec swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' -B 'Yes, exit sway' 'swaymsg exit'

for_window [app_id="float-shut"] floating enable, resize set 900 600, move position center
bindsym XF86PowerOff exec $term --class float-shut -e @HOME@/.tayowrld-bin/shutwow-pick
