# Keyboard layouts and MacBook touchpad.
input type:keyboard {
    xkb_layout "us,ru"
    xkb_options grp:ctrl_space_toggle
}

input type:touchpad {
    tap disabled
    dwt enabled
    natural_scroll enabled
    click_method clickfinger
}

bindgesture swipe:3:left workspace next_on_output
bindgesture swipe:3:right workspace prev_on_output
