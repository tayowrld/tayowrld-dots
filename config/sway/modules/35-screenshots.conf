# Existing screenshot.sh: output / region / window + Print.
bindsym --to-code $mod+Shift+s exec @CONFIG@/sway/utils/screenshot.sh output
bindsym --to-code $mod+Shift+d exec @CONFIG@/sway/utils/screenshot.sh region
bindsym --to-code $mod+Shift+f exec @CONFIG@/sway/utils/screenshot.sh window
bindsym Print exec @CONFIG@/sway/utils/screenshot.sh output
