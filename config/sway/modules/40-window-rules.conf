# Browser picture-in-picture floats, stays on all workspaces, never steals focus.
no_focus [title="(?i)^picture[ -]in[ -]picture$"]
for_window [title="(?i)^picture[ -]in[ -]picture$"] floating enable, sticky enable, resize set 640 360, move position 65 ppt 65 ppt, border pixel 1

# XWayland dialogs and plugin utility windows are popups.
for_window [window_type="dialog"] floating enable
for_window [window_type="utility"] floating enable

# REAPER's main project window stays tiled; its FX browser and plugin windows float.
for_window [class="^REAPER$" title="^(?!.*REAPER v[0-9]).*"] floating enable

# Video player windows should never join the tiling spiral.
for_window [app_id="^mpv$"] floating enable
for_window [class="^(?i:mpv)$"] floating enable
