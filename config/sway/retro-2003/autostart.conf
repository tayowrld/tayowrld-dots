# Theme-specific panel, notifications and desktop helpers.
exec waybar -c @CONFIG@/waybar/retro.jsonc -s @CONFIG@/waybar/retro.css
exec mako --config @CONFIG@/sway/retro-2003/mako.ini

# Insert new windows after the last opened tile, independent of focus.
exec python3 -u @CONFIG@/sway/utils/retro-spiral.py

# Float REAPER plugin windows that have no X11 class or title.
exec python3 -u @CONFIG@/sway/utils/reaper-popups.py

# Overlay visual corners on the built-in MacBook display.
