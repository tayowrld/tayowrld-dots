# Retro 2003: geometry, classic title bars, color palette and cursor.
gaps inner 8
gaps outer 10
font pango:3270 Nerd Font Mono 12
titlebar_border_thickness 1
titlebar_padding 3 2
default_border normal 1
default_floating_border normal 1
hide_edge_borders none

client.focused          #957c9c #fff3ed #4f4659 #957c9c #957c9c
client.focused_inactive #cbbdc7 #fff3ed #625a68 #cbbdc7 #cbbdc7
client.unfocused        #d9ccd0 #fff3ed #6a626e #d9ccd0 #d9ccd0
client.urgent           #bd6f79 #fff3ed #4f4659 #bd6f79 #bd6f79

seat * xcursor_theme pxsor 32
